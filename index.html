<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FOTOYA! Registro de Sesiones</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff9800">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e0f7fa;
      color: #0277bd;
    }
    header {
      background: #ff9800;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      max-width: 400px;
      margin: auto;
    }
    label { font-weight: bold; }
    input {
      padding: 14px;
      font-size: 18px;
      border: 2px solid #0277bd;
      border-radius: 8px;
    }
    button {
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #guardar { background: #ff9800; color: white; }
    #exportar { background: #0277bd; color: white; margin: 20px auto; display: block; }
    #limpiarLista { background: #d32f2f; color: white; margin: 20px auto; display: block; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      font-size: 16px;
    }
    th { background: #ff9800; color: white; }
    @media (max-width: 600px) {
      input, button { width: 100%; font-size: 18px; }
      table, th, td { font-size: 14px; }
    }
  </style>
</head>
<body>
  <header>FOTOYA! Registro de Sesiones</header>

  <form id="formSesion" onsubmit="return false;">
    <label>Cliente:<br><input type="text" id="cliente" required></label>
    <label>Foto desde:<br><input type="text" id="fotoDesde" required></label>
    <label>Foto hasta:<br><input type="text" id="fotoHasta" required></label>
    <label>Fotógrafo:<br><input type="text" id="fotografo" required></label>
    <label>Fecha:<br><input type="text" id="fecha" required></label>
    <button type="button" id="guardar">➕ Cargar tarjeta</button>
  </form>

  <h3 style="text-align:center; margin-top:30px;">Sesiones registradas</h3>
  <table id="tabla">
    <thead>
      <tr>
        <th>Cliente</th><th>FotoDesde</th><th>FotoHasta</th><th>Fotógrafo</th><th>Fecha</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <button id="exportar">📤 Exportar a CSV</button>
  <button id="limpiarLista">🗑️ Limpiar lista</button>

  <script>
    let registros = JSON.parse(localStorage.getItem('sesionesFoto') || '[]');
    const tbody = document.querySelector('#tabla tbody');

    function renderTabla() {
      tbody.innerHTML = '';
      registros.forEach(r => {
        const fila = document.createElement('tr');
        fila.innerHTML = `<td>${r.cliente}</td>
                          <td>${r.fotoDesde}</td>
                          <td>${r.fotoHasta}</td>
                          <td>${r.fotografo}</td>
                          <td>${r.fecha}</td>`;
        tbody.appendChild(fila);
      });
    }

    // Fecha actual por defecto
    function fechaHoy() {
      const hoy = new Date();
      const d = String(hoy.getDate()).padStart(2, '0');
      const m = String(hoy.getMonth() + 1).padStart(2, '0');
      const y = hoy.getFullYear();
      return `${d}/${m}/${y}`;
    }
    document.getElementById('fecha').value = fechaHoy();

    renderTabla();

    document.getElementById('guardar').onclick = () => {
      const sesion = {
        cliente: document.getElementById('cliente').value.trim(),
        fotoDesde: document.getElementById('fotoDesde').value.trim(),
        fotoHasta: document.getElementById('fotoHasta').value.trim(),
        fotografo: document.getElementById('fotografo').value.trim(),
        fecha: document.getElementById('fecha').value.trim()
      };
      if (!sesion.cliente || !sesion.fotoDesde || !sesion.fotoHasta || !sesion.fotografo || !sesion.fecha) {
        alert("Completa todos los campos");
        return;
      }
      registros.push(sesion);
      localStorage.setItem('sesionesFoto', JSON.stringify(registros));
      renderTabla();

      // Limpiar solo Cliente, Foto desde y Foto hasta
      document.getElementById('cliente').value = '';
      document.getElementById('fotoDesde').value = '';
      document.getElementById('fotoHasta').value = '';
      document.getElementById('cliente').focus();
    };

    document.getElementById('exportar').onclick = () => {
      const encabezados = "Cliente,FotoDesde,FotoHasta,Fotografo,Fecha\n";
      const filas = registros.map(r =>
        `${r.cliente},${r.fotoDesde},${r.fotoHasta},${r.fotografo},${r.fecha}`
      ).join("\n");
      const blob = new Blob([encabezados + filas], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "sesiones.csv";
      a.click();
    };

    // Botón para limpiar lista
    document.getElementById('limpiarLista').onclick = () => {
      if (confirm("¿Seguro que quieres borrar toda la lista?")) {
        registros = [];
        localStorage.removeItem('sesionesFoto');
        renderTabla();
      }
    };

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
